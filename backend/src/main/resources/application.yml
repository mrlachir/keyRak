spring:
  application:
    name: keyrak-marketplace-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/keyrak_marketplace?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:keyrak_user}
    password: ${MYSQL_PASSWORD:keyrak_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 160MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  web:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:keyrak-nextauth}
      audience: ${JWT_AUDIENCE:keyrak-api}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
  ai:
    groq:
      api-key: ${GROQ_API_KEY}
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
      endpoint: https://api.groq.com/openai/v1/chat/completions
  storage:
    id-card-directory: ${ID_DOCUMENT_STORAGE_DIR:./uploads/id-cards}
    property-media-directory: ${PROPERTY_MEDIA_STORAGE_DIR:./uploads/property-media}
