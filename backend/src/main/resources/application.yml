spring:
  application:
    name: keyrak-marketplace-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/keyrak_marketplace?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:keyrak_user}
    password: ${MYSQL_PASSWORD:keyrak_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  web:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:keyrak-nextauth}
      audience: ${JWT_AUDIENCE:keyrak-api}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: https://generativelanguage.googleapis.com/v1beta
