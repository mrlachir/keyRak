spring:
  datasource:
    url: jdbc:h2:mem:keyrak;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  web:
    allowed-origins: http://localhost:3000
  security:
    jwt:
      secret: test-secret-that-is-at-least-thirty-two-bytes-long
      issuer: keyrak-nextauth
      audience: keyrak-api
  oauth:
    google:
      client-id: test-google-client-id
  ai:
    gemini:
      api-key: test-gemini-key
      model: gemini-test-model
      base-url: https://example.test/v1beta
