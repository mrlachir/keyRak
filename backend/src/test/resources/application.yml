spring:
  datasource:
    url: jdbc:h2:mem:keyrak;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  web:
    allowed-origins: http://localhost:3000
  security:
    jwt:
      secret: test-secret-that-is-at-least-thirty-two-bytes-long
      issuer: keyrak-nextauth
      audience: keyrak-api
  oauth:
    google:
      client-id: test-google-client-id
  ai:
    groq:
      api-key: test-groq-key
      model: openai/gpt-oss-20b
      endpoint: https://example.test/openai/v1/chat/completions
  storage:
    id-card-directory: ${java.io.tmpdir}/keyrak-test-id-cards
    property-media-directory: ${java.io.tmpdir}/keyrak-test-property-media
