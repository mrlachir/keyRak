name: keyrak

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-keyrak_marketplace}
      MYSQL_USER: ${MYSQL_USERNAME:-keyrak_user}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - keyrak_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-keyrak_marketplace}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      MYSQL_USERNAME: ${MYSQL_USERNAME:-keyrak_user}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in the root .env file}
      JWT_ISSUER: ${JWT_ISSUER:-keyrak-nextauth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-keyrak-api}
      CORS_ALLOWED_ORIGINS: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in the root .env file}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      ID_DOCUMENT_STORAGE_DIR: /app/uploads/id-cards
      PROPERTY_MEDIA_STORAGE_DIR: /app/uploads/property-media
    secrets:
      - source: mysql_password
        target: MYSQL_PASSWORD
      - source: jwt_secret
        target: JWT_SECRET
      - source: groq_api_key
        target: GROQ_API_KEY
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - booking_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/properties/search"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - keyrak_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in the root .env file}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in the root .env file}
      JWT_ISSUER: ${JWT_ISSUER:-keyrak-nextauth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-keyrak-api}
      BACKEND_API_URL: http://backend:8080
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
    secrets:
      - nextauth_secret
      - google_client_secret
      - jwt_secret
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - keyrak_internal

volumes:
  mysql_data:
  booking_uploads:

networks:
  keyrak_internal:
    driver: bridge

secrets:
  mysql_root_password:
    environment: MYSQL_ROOT_PASSWORD
  mysql_password:
    environment: MYSQL_PASSWORD
  nextauth_secret:
    environment: NEXTAUTH_SECRET
  google_client_secret:
    environment: GOOGLE_CLIENT_SECRET
  jwt_secret:
    environment: JWT_SECRET
  groq_api_key:
    environment: GROQ_API_KEY
